# Blueprint de ejemplo para Render con SQLite en disco persistente.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: nsdash-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_PATH
        value: /data/database.db
      - key: ALLOWED_ORIGINS
        value: https://ns-dash.vercel.app,http://localhost:3000
    disk:
      name: nsdash-data
      mountPath: /data
      sizeGB: 1
